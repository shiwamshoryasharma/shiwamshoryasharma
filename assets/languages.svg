<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="444" viewBox="0 0 1120 444" role="img" aria-labelledby="title desc"><title id="title">Overall repository language mix</title><desc id="desc">Shares of GitHub-reported code bytes, not skill ratings.</desc><g font-family="Segoe UI, Inter, Arial, sans-serif"><rect x="0" y="0" width="1120" height="444" rx="32" fill="#0d111c" stroke="none"/><text x="36" y="48" fill="#9cf3cd" font-size="13" font-weight="700" text-anchor="start">LANGUAGE MIX</text><text x="36" y="88" fill="#edf2ff" font-size="28" font-weight="650" text-anchor="start">What the repositories are made of</text><text x="36" y="117" fill="#a2b0ca" font-size="16" font-weight="400" text-anchor="start">Public code bytes, aggregated across original repositories.</text><rect x="36" y="151" width="348.3" height="22" rx="0" fill="#DA5B0B" stroke="none"/><rect x="384.3" y="151" width="332.94" height="22" rx="0" fill="#3572A5" stroke="none"/><rect x="717.24" y="151" width="204.95" height="22" rx="0" fill="#3178c6" stroke="none"/><rect x="922.19" y="151" width="67.8" height="22" rx="0" fill="#e34c26" stroke="none"/><rect x="989.99" y="151" width="62.19" height="22" rx="0" fill="#f1e05a" stroke="none"/><rect x="1052.18" y="151" width="30.15" height="22" rx="0" fill="#663399" stroke="none"/><rect x="1082.32" y="151" width="1.31" height="22" rx="0" fill="#C1F12E" stroke="none"/><rect x="1083.63" y="151" width="0.37" height="22" rx="0" fill="#c6b6ff" stroke="none"/><rect x="36" y="206" width="12" height="12" rx="4" fill="#DA5B0B" stroke="none"/><text x="60" y="218" fill="#edf2ff" font-size="18" font-weight="400" text-anchor="start">Jupyter Notebook</text><text x="516" y="218" fill="#9cf3cd" font-size="18" font-weight="600" text-anchor="end">33.2%</text><rect x="588" y="206" width="12" height="12" rx="4" fill="#3572A5" stroke="none"/><text x="612" y="218" fill="#edf2ff" font-size="18" font-weight="400" text-anchor="start">Python</text><text x="1068" y="218" fill="#9c