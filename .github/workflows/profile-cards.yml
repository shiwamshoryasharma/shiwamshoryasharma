name: Refresh profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches: [main]
    paths:
      - scripts/update_profile.py
      - tests/test_source_files.py
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test source-file counting
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Generate public-data cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Publish changed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg assets/languages.svg assets/repo-city.svg assets/github-data.json
          if git diff --cached --quiet; then
            echo 'No public data changes.'
            exit 0
          fi
          git commit -m 'Refresh public profile cards'
          git push
